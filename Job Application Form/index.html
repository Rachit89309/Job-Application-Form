<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Page ka main wrapper: content ko center mein rakhta hai -->
    <div class="container">
      <!-- White card jisme poora form hai -->
      <div class="apply_box">
        <h1>
          Job Application
          <span class="title_small">(Web)</span>
        </h1>

        <!-- enctype file upload ke liye zaroori hai -->
        <form action="#" method="post" enctype="multipart/form-data">
          <!-- Grid container: saare fields yahan responsive grid mein aate hain -->
          <div class="form_container">
            <!-- First Name -->
            <div class="form_control">
              <label for="first_name">First Name</label>
              <input
                id="first_name"
                name="first_name"
                autocomplete="given-name"
                placeholder="Enter First Name"
                required
              />
            </div>

            <!-- Last Name -->
            <div class="form_control">
              <label for="last_name">Last Name</label>
              <input
                id="last_name"
                name="last_name"
                autocomplete="family-name"
                placeholder="Enter Last Name"
                required
              />
            </div>

            <!-- Email: type="email" browser se format validate karwata hai -->
            <div class="form_control">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                placeholder="Enter Email"
                required
              />
            </div>

            <!-- Job Role dropdown: pehla option khaali hai taaki user ko choose karna pade -->
            <div class="form_control">
              <label for="job_role">Job Role</label>
              <select id="job_role" name="job_role" required>
                <option value="">Select Job Role</option>
                <option value="frontend">Frontend Developer</option>
                <option value="backend">Backend Developer</option>
                <option value="full_stack">Full Stack Developer</option>
                <option value="ui_ux">UI UX Designer</option>
              </select>
            </div>

            <!-- Address: poori width leta hai (CSS mein grid-column: 1 / -1) -->
            <div class="textarea_control">
              <label for="address">Address</label>
              <textarea
                name="address"
                autocomplete="street-address"
                id="address"
                rows="4"
                cols="50"
                placeholder="Enter Address"
                required
              ></textarea>
            </div>

            <!-- City -->
            <div class="form_control">
              <label for="city">City</label>
              <input id="city" name="city" placeholder="Enter City" required />
            </div>

            <!-- Pincode: type="text" + pattern, taaki sirf 6 digit hi chalein -->
            <div class="form_control">
              <label for="pincode">Pincode</label>
              <input
                type="text"
                id="pincode"
                name="pincode"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                autocomplete="postal-code"
                placeholder="Enter Pincode"
                required
              />
            </div>

            <!-- Date: value neeche script se aaj ki date set hoti hai -->
            <div class="form_control">
              <label for="date">Date</label>
              <input type="date" id="date" name="date" />
            </div>

            <!-- CV upload: sirf PDF/DOC/DOCX allowed -->
            <div class="form_control">
              <label for="upload">Upload Your CV</label>
              <input
                type="file"
                id="upload"
                name="upload"
                accept=".pdf,.doc,.docx"
                required
              />
            </div>
          </div>

          <!-- Submit button (right side par, CSS flex se) -->
          <div class="button_container">
            <button type="submit">Apply Now</button>
          </div>
